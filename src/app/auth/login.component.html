<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <img
        class="auth-brand__logo"
        src="/assets/branding/LOGO_CHATBOT.png"
        alt="Asistente MIDAGRI"
      />
    </div>
    <h1 class="auth-title">Asistente jurídico MIDAGRI</h1>
    <p class="auth-sub">
      Consultas orientativas sobre normativa y trámites del Ministerio de
      Desarrollo Agrario y Riego. No constituye opinión legal vinculante.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label class="auth-label" for="email">Correo institucional</label>
      <input
        id="email"
        class="auth-input"
        type="email"
        autocomplete="username"
        formControlName="email"
      />

      <label class="auth-label" for="password">Contraseña</label>
      <input
        id="password"
        class="auth-input"
        type="password"
        autocomplete="current-password"
        formControlName="password"
      />

      @if (error) {
        <p class="auth-error" role="alert">{{ error }}</p>
      }

      <button class="auth-submit" type="submit" [disabled]="loading">
        {{ loading ? 'Entrando…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="auth-footer">
      ¿Sin cuenta? <a routerLink="/register">Crear cuenta</a>
    </p>
  </div>
</div>
